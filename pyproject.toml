[project]
name = "ebook-normalizer"
version = "0.1.0"
description = "Local-first, AI-assisted EPUB metadata enrichment and filename normalization pipeline."
authors = [{ name = "Jennifer" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE.txt" }

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
